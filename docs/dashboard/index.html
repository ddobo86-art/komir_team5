&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;mineral-studio&#x27;),main=root.querySelector(&#x27;#ms-main&#x27;);
const receipts=[180,192,214,205,228,220,235,210,232,248,226,205],done=[156,170,186,181,201,193,208,182,204,216,198,180];
const minerals=[[&#x27;석회석&#x27;,88],[&#x27;규석&#x27;,62],[&#x27;장석&#x27;,41],[&#x27;고령토&#x27;,35],[&#x27;기타&#x27;,22]],items=[[&#x27;화학분석&#x27;,102],[&#x27;물성시험&#x27;,68],[&#x27;XRF 분석&#x27;,46],[&#x27;XRD 분석&#x27;,32]];
const places=[{name:&#x27;지적 A&#x27;,count:96,province:&#x27;강원&#x27;,x:0,y:0},{name:&#x27;지적 B&#x27;,count:82,province:&#x27;충북&#x27;,x:0,y:0},{name:&#x27;지적 C&#x27;,count:70,province:&#x27;경북&#x27;,x:0,y:0}];
const saved=window.openai?.widgetState?.modelContent||{};
const state={month:10,screen:&#x27;home&#x27;,tab:&#x27;광종별&#x27;,place:0,metric:&#x27;접수&#x27;};
if(saved.design===&#x27;mineral-studio-v3&#x27;){if(saved.month&gt;=1&amp;&amp;saved.month&lt;=12)state.month=saved.month;if([&#x27;home&#x27;,&#x27;monthly&#x27;,&#x27;staff&#x27;,&#x27;map&#x27;,&#x27;status&#x27;].includes(saved.screen))state.screen=saved.screen;if([&#x27;광종별&#x27;,&#x27;시험항목별&#x27;].includes(saved.tab))state.tab=saved.tab;if(Number.isInteger(saved.place)&amp;&amp;saved.place&gt;=0&amp;&amp;saved.place&lt;3)state.place=saved.place;}
const mapPositions=[{&quot;x&quot;:55.33764903285669,&quot;y&quot;:18.609213539998322},{&quot;x&quot;:50.654491257857444,&quot;y&quot;:36.10222550778951},{&quot;x&quot;:59.845429818746425,&quot;y&quot;:42.912900118431345}];places.forEach((p,i)=&gt;Object.assign(p,mapPositions[i]));
const fmt=n=&gt;n.toLocaleString(&#x27;ko-KR&#x27;);
function split(rows,total){const base=rows.reduce((s,r)=&gt;s+r[1],0);let used=0;return rows.map(([name,n],i)=&gt;{const value=i===rows.length-1?total-used:Math.round(n/base*total);used+=value;return[name,value]})}
function btn(label,action,attr=&#x27;&#x27;){return `&lt;button type=&quot;button&quot; class=&quot;ms-pill&quot; data-action=&quot;${action}&quot; ${attr}&gt;${label}&lt;/button&gt;`}
function monthStrip(){return `&lt;div class=&quot;ms-monthline&quot;&gt;&lt;span class=&quot;ms-monthyear&quot;&gt;2026&lt;/span&gt;&lt;div class=&quot;ms-months&quot; aria-label=&quot;월별 통계 상세&quot;&gt;${receipts.map((_,i)=&gt;`&lt;button type=&quot;button&quot; data-action=&quot;month&quot; data-month=&quot;${i+1}&quot; aria-pressed=&quot;${state.month===i+1}&quot; aria-label=&quot;${i+1}월 시험통계 상세&quot;&gt;${i+1}월&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`}
function stats(){const n=receipts[state.month-1],d=done[state.month-1];return `&lt;section class=&quot;ms-stats&quot; aria-label=&quot;선택 월 핵심 실적&quot;&gt;${[[&#x27;접수&#x27;,n,&#x27;해당 월에 접수한 의뢰&#x27;],[&#x27;완수&#x27;,d,&#x27;해당 월 접수 중 완수&#x27;],[&#x27;진행 중&#x27;,n-d,&#x27;해당 월 접수 중 미완수&#x27;],[&#x27;완수율&#x27;,(d/n*100).toFixed(1),&#x27;선택 월 접수 기준&#x27;]].map(([l,v,note])=&gt;`&lt;button type=&quot;button&quot; class=&quot;ms-stat&quot; data-action=&quot;status&quot; data-metric=&quot;${l}&quot;&gt;&lt;div class=&quot;ms-stat-top&quot;&gt;&lt;span&gt;${state.month}월 ${l}&lt;/span&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ms-number&quot;&gt;${v}&lt;small&gt;${l===&#x27;완수율&#x27;?&#x27;%&#x27;:&#x27;건&#x27;}&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;ms-stat-note&quot;&gt;${note}&lt;/div&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/section&gt;`}
function ranks(rows,green=false){return `&lt;div class=&quot;ms-ranks&quot;&gt;${rows.map(([name,n])=&gt;`&lt;div class=&quot;ms-rank&quot;&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;div class=&quot;ms-track&quot;&gt;&lt;div class=&quot;ms-fill ${green?&#x27;green&#x27;:&#x27;&#x27;}&quot; style=&quot;width:${n/Math.max(...rows.map(r=&gt;r[1]))*100}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;ms-count&quot;&gt;${n}건&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`}
function mapPanel(){const counts=split(places.map(p=&gt;[p.name,p.count]),receipts[state.month-1]);return `&lt;section class=&quot;ms-panel&quot;&gt;&lt;div class=&quot;ms-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;지적별 의뢰현황&lt;/h2&gt;&lt;p class=&quot;ms-sub&quot;&gt;전국 의뢰 분포&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;ms-textbtn&quot; data-action=&quot;map&quot;&gt;상세 보기 ↗&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ms-mapstage&quot;&gt;${document.getElementById(&#x27;ms-map-template&#x27;).innerHTML}&lt;span class=&quot;ms-maplabel&quot;&gt;지적 위치 · 건수 예시&lt;/span&gt;${places.map((p,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;ms-pin&quot; style=&quot;left:${p.x}%;top:${p.y}%&quot; data-action=&quot;place&quot; data-place=&quot;${i}&quot; aria-label=&quot;${p.name}, 예시 위치 ${p.province}, 의뢰 ${counts[i][1]}건 상세&quot;&gt;${counts[i][1]}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;ms-mapfoot&quot;&gt;&lt;span&gt;&lt;span class=&quot;ms-dot&quot;&gt;&lt;/span&gt; 의뢰건수 · 지적 선택 시 상세&lt;/span&gt;&lt;a href=&quot;https://github.com/southkorea/southkorea-maps&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;지도: 통계청 2013 경계&lt;/a&gt;&lt;/div&gt;&lt;/section&gt;`}
function trend(){const w=330,h=183,L=28,R=5,T=13,B=28,plotH=h-T-B,plotW=w-L-R,step=plotW/12;const bars=receipts.map((n,i)=&gt;{const x=L+i*step+step*.2,y=T+plotH-n/300*plotH;return `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${step*.32}&quot; height=&quot;${T+plotH-y}&quot; rx=&quot;2&quot; fill=&quot;var(--navy)&quot; opacity=&quot;${i===state.month-1?1:.35}&quot;/&gt;&lt;rect x=&quot;${x+step*.36}&quot; y=&quot;${T+plotH-done[i]/300*plotH}&quot; width=&quot;${step*.25}&quot; height=&quot;${done[i]/300*plotH}&quot; rx=&quot;2&quot; fill=&quot;var(--green)&quot; opacity=&quot;${i===state.month-1?1:.45}&quot;/&gt;&lt;text x=&quot;${L+i*step+step/2}&quot; y=&quot;${h-8}&quot; text-anchor=&quot;middle&quot;&gt;${i+1}&lt;/text&gt;`}).join(&#x27;&#x27;);return `&lt;section class=&quot;ms-panel&quot;&gt;&lt;div class=&quot;ms-panelhead&quot;&gt;&lt;h2&gt;월별 접수·완수 추이&lt;/h2&gt;&lt;span class=&quot;ms-small&quot;&gt;단위: 건&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ms-trendhead&quot;&gt;&lt;span class=&quot;ms-trendvalue&quot;&gt;${fmt(receipts[state.month-1])}&lt;small style=&quot;font-size:12px;font-weight:400&quot;&gt; 건&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;ms-small&quot;&gt;${state.month}월 접수&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ms-legend&quot;&gt;&lt;span&gt;&lt;b&gt;&lt;/b&gt;접수&lt;/span&gt;&lt;span&gt;&lt;b class=&quot;green&quot;&gt;&lt;/b&gt;해당 월 접수 중 완수&lt;/span&gt;&lt;/div&gt;&lt;svg class=&quot;ms-trend&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;2026년 월별 접수와 해당 월 접수 중 완수 건수. ${receipts.map((n,i)=&gt;`${i+1}월 접수 ${n}건, 완수 ${done[i]}건`).join(&#x27;; &#x27;)}&quot;&gt;${[0,100,200,300].map(n=&gt;`&lt;line class=&quot;ms-gridline&quot; x1=&quot;${L}&quot; x2=&quot;${w-R}&quot; y1=&quot;${T+plotH-n/300*plotH}&quot; y2=&quot;${T+plotH-n/300*plotH}&quot;/&gt;&lt;text x=&quot;${L-5}&quot; y=&quot;${T+plotH-n/300*plotH+4}&quot; text-anchor=&quot;end&quot;&gt;${n}&lt;/text&gt;`).join(&#x27;&#x27;)}${bars}
